      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0.himbara.paynet:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/himbara.paynet/peers/peer0.himbara.paynet/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/himbara.paynet/peers/peer0.himbara.paynet/tls:/etc/hyperledger/fabric/tls
    ports:

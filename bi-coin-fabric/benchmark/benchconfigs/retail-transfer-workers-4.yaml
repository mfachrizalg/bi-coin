test:
  name: Digital Rupiah Retail Transfer Benchmark - 4 Workers
  description: Seeded low-contention retail transfer baseline with four Caliper workers
  workers:
    type: local
    number: 4
  rounds:
    - label: retail-warmup-w4
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: benchmark/workloads/retail-transfer.js
        arguments:
          scenario: transfer-w4
          customers: 29
          merchants: 4
          transactionSlots: 13
          fundedRatio: 1
          maxTransferAmount: 50000
          seed: 20260725

    - label: retail-sustained-w4
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 30
      workload:
        module: benchmark/workloads/retail-transfer.js
        arguments:
          scenario: transfer-w4
          customers: 29
          merchants: 4
          transactionSlots: 13
          fundedRatio: 1
          maxTransferAmount: 50000
          seed: 20260725

    - label: retail-peak-w4
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 60
      workload:
        module: benchmark/workloads/retail-transfer.js
        arguments:
          scenario: transfer-w4
          customers: 29
          merchants: 4
          transactionSlots: 13
          fundedRatio: 1
          maxTransferAmount: 50000
          seed: 20260725

observer:
  type: local
  interval: 1

monitors:
  resource:
    - module: docker
      options:
        interval: 1
        cpuUsageNormalization: true
        containers:
          - /peer0.bi.paynet
          - /peer0.himbara.paynet
          - /peer0.commercial.paynet
          - /peer0.pjp.paynet
          - /peer0.ojk.paynet
          - /couchdb0.bi.paynet
          - /couchdb0.himbara.paynet
          - /couchdb0.commercial.paynet
          - /couchdb0.pjp.paynet
          - /couchdb0.ojk.paynet
          - /orderer.paynet

test:
  name: Digital Rupiah Retail Transfer Benchmark - 4 Workers
  description: Contention-free retail transfer baseline with four Caliper workers
  workers:
    type: local
    number: 4
  rounds:
    - label: retail-warmup-w4
      txNumber: 40
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: benchmark/workloads/retail-transfer.js
        arguments:
          scenario: transfer-w4
          customers: 40
          merchants: 10
          transactionSlots: 10
          fundedRatio: 1

    - label: retail-sustained-w4
      txNumber: 40
      rateControl:
        type: fixed-rate
        opts:
          tps: 30
      workload:
        module: benchmark/workloads/retail-transfer.js
        arguments:
          scenario: transfer-w4
          customers: 40
          merchants: 10
          transactionSlots: 10
          fundedRatio: 1

    - label: retail-peak-w4
      txNumber: 40
      rateControl:
        type: fixed-rate
        opts:
          tps: 60
      workload:
        module: benchmark/workloads/retail-transfer.js
        arguments:
          scenario: transfer-w4
          customers: 40
          merchants: 10
          transactionSlots: 10
          fundedRatio: 1

observer:
  type: local
  interval: 1

monitor:
  type: docker
  docker:
    name:
      - peer0.bi.paynet
      - peer0.himbara.paynet
      - peer0.commercial.paynet
      - peer0.pjp.paynet
      - orderer.paynet
  interval: 1

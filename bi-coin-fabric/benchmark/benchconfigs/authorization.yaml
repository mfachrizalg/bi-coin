test:
  name: Digital Rupiah Custody Authorization
  description: A non-custodian MSP must be rejected by chaincode while setup and target are explicit actors
  workers:
    type: local
    number: 1
  rounds:
    - label: custody-authorization
      txNumber: 1
      rateControl:
        type: fixed-rate
        opts:
          tps: 1
      workload:
        module: benchmark/workloads/custody-authorization.js
        arguments:
          scenario: custody-authorization
          seed: 20260725

observer:
  type: local
  interval: 1

monitors:
  transaction:
    - module: ./benchmark/observers/jsonl-transaction-observer.js
      options: {}
  resource:
    - module: docker
      options:
        interval: 1
        cpuUsageNormalization: true
        containers:
          - /peer0.bi.paynet
          - /peer0.himbara.paynet
          - /peer0.commercial.paynet
          - /peer0.pjp.paynet
          - /peer0.ojk.paynet
          - /orderer.paynet

test:
  name: Digital Rupiah Retail Transfer Benchmark - 2 Workers
  description: Seeded low-contention retail transfer baseline with two Caliper workers
  workers:
    type: local
    number: 2
  rounds:
    - label: retail-warmup-w2
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 10
      workload:
        module: benchmark/workloads/retail-transfer.js
        arguments:
          scenario: transfer-w2
          customers: 58
          merchants: 8
          transactionSlots: 26
          fundedRatio: 1
          maxTransferAmount: 50000
          seed: 20260725

    - label: retail-sustained-w2
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 30
      workload:
        module: benchmark/workloads/retail-transfer.js
        arguments:
          scenario: transfer-w2
          customers: 58
          merchants: 8
          transactionSlots: 26
          fundedRatio: 1
          maxTransferAmount: 50000
          seed: 20260725

    - label: retail-peak-w2
      txDuration: 120
      rateControl:
        type: fixed-rate
        opts:
          tps: 60
      workload:
        module: benchmark/workloads/retail-transfer.js
        arguments:
          scenario: transfer-w2
          customers: 58
          merchants: 8
          transactionSlots: 26
          fundedRatio: 1
          maxTransferAmount: 50000
          seed: 20260725

observer:
  type: local
  interval: 1

monitors:
  resource:
    - module: docker
      options:
        interval: 1
        cpuUsageNormalization: true
        containers:
          - /peer0.bi.paynet
          - /peer0.himbara.paynet
          - /peer0.commercial.paynet
          - /peer0.pjp.paynet
          - /peer0.ojk.paynet
          - /couchdb0.bi.paynet
          - /couchdb0.himbara.paynet
          - /couchdb0.commercial.paynet
          - /couchdb0.pjp.paynet
          - /couchdb0.ojk.paynet
          - /orderer.paynet

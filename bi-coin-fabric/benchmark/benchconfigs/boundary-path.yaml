test:
  name: Digital Rupiah Boundary-Value Conformance
  description: Probes each cap from both sides; a value exactly at the limit must commit and one unit past it must be rejected
  workers:
    type: local
    number: 1
  rounds:
    - label: boundary-path
      txNumber: 8
      rateControl:
        type: fixed-rate
        opts:
          tps: 2
      workload:
        module: benchmark/workloads/boundary-path.js
        arguments:
          scenario: boundary-path

observer:
  type: local
  interval: 1

monitors:
  resource:
    - module: docker
      options:
        interval: 1
        cpuUsageNormalization: true
        containers:
          - /peer0.bi.paynet
          - /peer0.himbara.paynet
          - /peer0.commercial.paynet
          - /peer0.pjp.paynet
          - /peer0.ojk.paynet
          - /couchdb0.bi.paynet
          - /couchdb0.himbara.paynet
          - /couchdb0.commercial.paynet
          - /couchdb0.pjp.paynet
          - /couchdb0.ojk.paynet
          - /orderer.paynet

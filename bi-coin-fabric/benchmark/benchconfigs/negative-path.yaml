test:
  name: Digital Rupiah Negative-Path Conformance
  description: Every submission violates one policy rule and must be rejected; a zero-gap run proves enforcement
  workers:
    type: local
    number: 1
  rounds:
    - label: negative-path
      txNumber: 7
      rateControl:
        type: fixed-rate
        opts:
          tps: 5
      workload:
        module: benchmark/workloads/negative-path.js
        arguments:
          scenario: negative-path
          seed: 20260725

observer:
  type: local
  interval: 1

monitors:
  transaction:
    - module: ./benchmark/observers/jsonl-transaction-observer.js
      options: {}
  resource:
    - module: docker
      options:
        interval: 1
        cpuUsageNormalization: true
        containers:
          - /peer0.bi.paynet
          - /peer0.himbara.paynet
          - /peer0.commercial.paynet
          - /peer0.pjp.paynet
          - /peer0.ojk.paynet
          - /couchdb0.bi.paynet
          - /couchdb0.himbara.paynet
          - /couchdb0.commercial.paynet
          - /couchdb0.pjp.paynet
          - /couchdb0.ojk.paynet
          - /orderer.paynet

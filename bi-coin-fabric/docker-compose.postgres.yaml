services:
  postgres:
    image: postgres:16-alpine
    container_name: bi-coin-fabric-postgres
    environment:
      POSTGRES_DB: bicoin
      POSTGRES_USER: bicoin
      POSTGRES_PASSWORD: bicoin
    ports:
      - "5433:5432"
    volumes:
      - bi_coin_fabric_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bicoin -d bicoin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bi_coin_fabric_postgres:


version: '2'

volumes:
  ca-centralbank-data:

networks:
  bi-coin:
    name: bi-coin

services:
  ca.centralbank:
    container_name: ca.centralbank
    image: hyperledger/fabric-ca:1.5.9
    environment:
      - FABRIC_CA_SERVER_CA_NAME=ca-centralbank
      - FABRIC_CA_SERVER_TLS_ENABLED=false
      - FABRIC_CA_SERVER_PORT=7054
    command:
      - sh
      - -c
      - fabric-ca-server start -b caadmin:adminpw -d
    volumes:
      - ca-centralbank-data:/etc/hyperledger/fabric-ca-server
    ports:
      - 127.0.0.1:7054:7054
    networks:
      - bi-coin

  orderer.bi-coin:
    container_name: orderer.bi-coin
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
    working_dir: /root
    command: orderer
    volumes:
      - ./organizations/ordererOrganizations/bi-coin/orderers/orderer.bi-coin/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/bi-coin/orderers/orderer.bi-coin/tls:/var/hyperledger/orderer/tls
    ports:
      - 7050:7050
      - 7053:7053
    networks:
      - bi-coin

  peer0.bi-coin:
    container_name: peer0.bi-coin
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=bi-coin
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.bi-coin
      - CORE_PEER_ADDRESS=peer0.bi-coin:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.bi-coin:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.bi-coin:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.bi-coin:7051
      - CORE_PEER_LOCALMSPID=CentralBankMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.bi-coin:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/bi-coin/peers/peer0.bi-coin/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/bi-coin/peers/peer0.bi-coin/tls:/etc/hyperledger/fabric/tls
    ports:
      - 7051:7051
    depends_on:
      - orderer.bi-coin
      - couchdb.bi-coin
    networks:
      - bi-coin

  couchdb.bi-coin:
    container_name: couchdb.bi-coin
    image: couchdb:3.2
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - 5984:5984
    networks:
      - bi-coin

  peer0.distributor.bi-coin:
    container_name: peer0.distributor.bi-coin
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=bi-coin
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.distributor.bi-coin
      - CORE_PEER_ADDRESS=peer0.distributor.bi-coin:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.distributor.bi-coin:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.bi-coin:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.distributor.bi-coin:9051
      - CORE_PEER_LOCALMSPID=DistributorMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.distributor.bi-coin:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/distributor.bi-coin/peers/peer0.distributor.bi-coin/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/distributor.bi-coin/peers/peer0.distributor.bi-coin/tls:/etc/hyperledger/fabric/tls
    ports:
      - 9051:9051
    depends_on:
      - orderer.bi-coin
      - couchdb.distributor.bi-coin
    networks:
      - bi-coin

  couchdb.distributor.bi-coin:
    container_name: couchdb.distributor.bi-coin
    image: couchdb:3.2
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - 6984:5984
    networks:
      - bi-coin

  peer0.validator.bi-coin:
    container_name: peer0.validator.bi-coin
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=bi-coin
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.validator.bi-coin
      - CORE_PEER_ADDRESS=peer0.validator.bi-coin:12051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:12051
      - CORE_PEER_CHAINCODEADDRESS=peer0.validator.bi-coin:12052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:12052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.bi-coin:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.validator.bi-coin:12051
      - CORE_PEER_LOCALMSPID=ValidatorMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.validator.bi-coin:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/validator.bi-coin/peers/peer0.validator.bi-coin/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/validator.bi-coin/peers/peer0.validator.bi-coin/tls:/etc/hyperledger/fabric/tls
    ports:
      - 12051:12051
    depends_on:
      - orderer.bi-coin
      - couchdb.validator.bi-coin
    networks:
      - bi-coin

  couchdb.validator.bi-coin:
    container_name: couchdb.validator.bi-coin
    image: couchdb:3.2
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - 8984:5984
    networks:
      - bi-coin

  peer0.enduser.bi-coin:
    container_name: peer0.enduser.bi-coin
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=bi-coin
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.enduser.bi-coin
      - CORE_PEER_ADDRESS=peer0.enduser.bi-coin:13051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:13051
      - CORE_PEER_CHAINCODEADDRESS=peer0.enduser.bi-coin:13052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:13052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.bi-coin:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.enduser.bi-coin:13051
      - CORE_PEER_LOCALMSPID=EndUserMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.enduser.bi-coin:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/enduser.bi-coin/peers/peer0.enduser.bi-coin/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/enduser.bi-coin/peers/peer0.enduser.bi-coin/tls:/etc/hyperledger/fabric/tls
    ports:
      - 13051:13051
    depends_on:
      - orderer.bi-coin
      - couchdb.enduser.bi-coin
    networks:
      - bi-coin

  couchdb.enduser.bi-coin:
    container_name: couchdb.enduser.bi-coin
    image: couchdb:3.2
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - 9984:5984
    networks:
      - bi-coin

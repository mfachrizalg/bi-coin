Organizations:
  - &CentralBank
    Name: CentralBankMSP
    ID: CentralBankMSP
    MSPDir: organizations/peerOrganizations/bi-coin/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('CentralBankMSP.admin', 'CentralBankMSP.peer', 'CentralBankMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('CentralBankMSP.admin', 'CentralBankMSP.client', 'CentralBankMSP.orderer')"
      Admins:
        Type: Signature
        Rule: "OR('CentralBankMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('CentralBankMSP.peer')"
    OrdererEndpoints:
      - "orderer.bi-coin:7050"
    AnchorPeers:
      - Host: peer0.bi-coin
        Port: 7051

  - &OrdererOrg
    Name: OrdererMSP
    ID: OrdererMSP
    MSPDir: organizations/ordererOrganizations/bi-coin/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"
    OrdererEndpoints:
      - "orderer.bi-coin:7050"

  - &Distributor
    Name: DistributorMSP
    ID: DistributorMSP
    MSPDir: organizations/peerOrganizations/distributor.bi-coin/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('DistributorMSP.admin', 'DistributorMSP.peer', 'DistributorMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('DistributorMSP.admin', 'DistributorMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('DistributorMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('DistributorMSP.peer')"
    AnchorPeers:
      - Host: peer0.distributor.bi-coin
        Port: 9051

  - &Validator
    Name: ValidatorMSP
    ID: ValidatorMSP
    MSPDir: organizations/peerOrganizations/validator.bi-coin/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('ValidatorMSP.admin', 'ValidatorMSP.peer', 'ValidatorMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('ValidatorMSP.admin', 'ValidatorMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('ValidatorMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('ValidatorMSP.peer')"
    AnchorPeers:
      - Host: peer0.validator.bi-coin
        Port: 12051

  - &EndUser
    Name: EndUserMSP
    ID: EndUserMSP
    MSPDir: organizations/peerOrganizations/enduser.bi-coin/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('EndUserMSP.admin', 'EndUserMSP.peer', 'EndUserMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('EndUserMSP.admin', 'EndUserMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('EndUserMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('EndUserMSP.peer')"
    AnchorPeers:
      - Host: peer0.enduser.bi-coin
        Port: 13051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_0: true
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: Signature
      Rule: "OR('CentralBankMSP.admin','CentralBankMSP.client','DistributorMSP.admin','DistributorMSP.client','EndUserMSP.admin','EndUserMSP.client')"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: Signature
      Rule: "AND('CentralBankMSP.member',OR('DistributorMSP.member','EndUserMSP.member'))"
    Endorsement:
      Type: Signature
      Rule: "OR('CentralBankMSP.member','DistributorMSP.member','EndUserMSP.member')"
  Capabilities: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer.bi-coin:7050
  EtcdRaft:
    Consenters:
      - Host: orderer.bi-coin
        Port: 7050
        ClientTLSCert: organizations/ordererOrganizations/bi-coin/orderers/orderer.bi-coin/tls/server.crt
        ServerTLSCert: organizations/ordererOrganizations/bi-coin/orderers/orderer.bi-coin/tls/server.crt
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 10 MB
    PreferredMaxBytes: 2 MB
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities: *ChannelCapabilities

# Fabric v3 channel-participation: a single application-channel profile producing the
# channel genesis block (no system channel, no Consortiums).
Profiles:
  GarudaApplicationChannel:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
      Capabilities: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *CentralBank
        - *Distributor
        - *Validator
        - *EndUser
      Capabilities: *ApplicationCapabilities

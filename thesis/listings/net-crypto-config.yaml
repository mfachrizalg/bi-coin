# CentralBankMSP is not generated by cryptogen. bootstrap-centralbank.sh
# enrolls its peer, orderer, admin, and client identities from ca.centralbank.
PeerOrgs:
  - Name: Distributor
    Domain: distributor.rupiah.study
    EnableNodeOUs: true
    Template:
      Count: 1
      SANS:
        - localhost
        - 127.0.0.1
    Users:
      Count: 3

  - Name: Validator
    Domain: validator.rupiah.study
    EnableNodeOUs: true
    Template:
      Count: 1
      SANS:
        - localhost
        - 127.0.0.1
    Users:
      Count: 1

  - Name: EndUser
    Domain: enduser.rupiah.study
    EnableNodeOUs: true
    Template:
      Count: 1
      SANS:
        - localhost
        - 127.0.0.1
    Users:
      Count: 8

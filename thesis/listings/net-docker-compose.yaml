name: bi-coin-rupiah-study

networks:
  study:
    name: rupiah-study

volumes:
  centralbank-peer-data:
    name: bi-coin-rupiah-study-centralbank-peer
  distributor-peer-data:
    name: bi-coin-rupiah-study-distributor-peer
  validator-peer-data:
    name: bi-coin-rupiah-study-validator-peer
  enduser-peer-data:
    name: bi-coin-rupiah-study-enduser-peer
  orderer-data:
    name: bi-coin-rupiah-study-orderer
  centralbank-couch-data:
    name: bi-coin-rupiah-study-centralbank-couch
  distributor-couch-data:
    name: bi-coin-rupiah-study-distributor-couch
  validator-couch-data:
    name: bi-coin-rupiah-study-validator-couch
  enduser-couch-data:
    name: bi-coin-rupiah-study-enduser-couch
  centralbank-ca-data:
    name: bi-coin-rupiah-study-centralbank-ca
  study-postgres-data:
    name: bi-coin-rupiah-study-postgres

x-couchdb-environment: &couchdb-environment
  COUCHDB_USER: ${STUDY_COUCHDB_USER}
  COUCHDB_PASSWORD: ${STUDY_COUCHDB_PASSWORD}

x-peer-environment: &peer-environment
  FABRIC_LOGGING_SPEC: INFO
  CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
  CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: rupiah-study
  CORE_PEER_TLS_ENABLED: "true"
  CORE_PEER_PROFILE_ENABLED: "true"
  CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
  CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
  CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
  CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
  CORE_PEER_CHAINCODEADDRESS: peer0:7052
  CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
  CORE_LEDGER_STATE_STATEDATABASE: CouchDB

services:
  ca.centralbank:
    image: hyperledger/fabric-ca:1.5.9
    container_name: study-ca-centralbank
    profiles: [ca]
    environment:
      FABRIC_CA_SERVER_CA_NAME: ca-centralbank
      FABRIC_CA_SERVER_TLS_ENABLED: "false"
      FABRIC_CA_SERVER_PORT: 7054
      STUDY_CA_ADMIN_USER: ${STUDY_CA_ADMIN_USER}
      STUDY_CA_ADMIN_SECRET: ${STUDY_CA_ADMIN_SECRET}
    command:
      - sh
      - -c
      - fabric-ca-server start -b "$$STUDY_CA_ADMIN_USER:$$STUDY_CA_ADMIN_SECRET" -d
    volumes:
      - centralbank-ca-data:/etc/hyperledger/fabric-ca-server
    ports:
      - "127.0.0.1:17054:7054"
    networks: [study]

  study-cli:
    image: hyperledger/fabric-tools:2.5
    container_name: study-cli
    profiles: [tools]
    environment:
      FABRIC_CFG_PATH: /etc/hyperledger/fabric
      CORE_PEER_TLS_ENABLED: "true"
    entrypoint:
      - sh
      - -c
      - while true; do sleep 3600; done
    volumes:
      - ./organizations:/study/organizations:ro
      - ../../study/chaincode:/study/chaincode:ro
      - ./packages:/study/packages
    networks: [study]

  study-postgres:
    image: postgres:16-alpine
    container_name: study-postgres
    profiles: [network]
    environment:
      POSTGRES_USER: ${STUDY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${STUDY_POSTGRES_PASSWORD}
      POSTGRES_DB: ${STUDY_POSTGRES_DB}
    volumes:
      - study-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    networks: [study]

  orderer.centralbank.rupiah.study:
    image: hyperledger/fabric-orderer:2.5
    container_name: study-orderer-centralbank
    profiles: [network]
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_GENERAL_LOCALMSPID: CentralBankMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
    command: orderer
    volumes:
      - ./organizations/ordererOrganizations/centralbank.rupiah.study/orderers/orderer.centralbank.rupiah.study/msp:/var/hyperledger/orderer/msp:ro
      - ./organizations/ordererOrganizations/centralbank.rupiah.study/orderers/orderer.centralbank.rupiah.study/tls:/var/hyperledger/orderer/tls:ro
      - orderer-data:/var/hyperledger/production
    ports:
      - "17050:7050"
      - "17053:7053"
    networks: [study]

  couchdb.centralbank.rupiah.study:
    image: couchdb:3.3
    container_name: study-couchdb-centralbank
    profiles: [network]
    environment: *couchdb-environment
    volumes:
      - centralbank-couch-data:/opt/couchdb/data
    ports: ["127.0.0.1:17584:5984"]
    networks: [study]

  peer0.centralbank.rupiah.study:
    image: hyperledger/fabric-peer:2.5
    container_name: study-peer0-centralbank
    profiles: [network]
    environment:
      <<: *peer-environment
      CORE_PEER_ID: peer0.centralbank.rupiah.study
      CORE_PEER_ADDRESS: peer0.centralbank.rupiah.study:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.centralbank.rupiah.study:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.centralbank.rupiah.study:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.centralbank.rupiah.study:7051
      CORE_PEER_LOCALMSPID: CentralBankMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.centralbank.rupiah.study:5984
      CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: ${STUDY_COUCHDB_USER}
      CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: ${STUDY_COUCHDB_PASSWORD}
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/centralbank.rupiah.study/peers/peer0.centralbank.rupiah.study/msp:/etc/hyperledger/fabric/msp:ro
      - ./organizations/peerOrganizations/centralbank.rupiah.study/peers/peer0.centralbank.rupiah.study/tls:/etc/hyperledger/fabric/tls:ro
      - centralbank-peer-data:/var/hyperledger/production
    depends_on: [orderer.centralbank.rupiah.study, couchdb.centralbank.rupiah.study]
    ports: ["17051:7051"]
    networks: [study]

  couchdb.distributor.rupiah.study:
    image: couchdb:3.3
    container_name: study-couchdb-distributor
    profiles: [network]
    environment: *couchdb-environment
    volumes:
      - distributor-couch-data:/opt/couchdb/data
    ports: ["127.0.0.1:18584:5984"]
    networks: [study]

  peer0.distributor.rupiah.study:
    image: hyperledger/fabric-peer:2.5
    container_name: study-peer0-distributor
    profiles: [network]
    environment:
      <<: *peer-environment
      CORE_PEER_ID: peer0.distributor.rupiah.study
      CORE_PEER_ADDRESS: peer0.distributor.rupiah.study:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.distributor.rupiah.study:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.distributor.rupiah.study:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.distributor.rupiah.study:7051
      CORE_PEER_LOCALMSPID: DistributorMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.distributor.rupiah.study:5984
      CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: ${STUDY_COUCHDB_USER}
      CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: ${STUDY_COUCHDB_PASSWORD}
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/distributor.rupiah.study/peers/peer0.distributor.rupiah.study/msp:/etc/hyperledger/fabric/msp:ro
      - ./organizations/peerOrganizations/distributor.rupiah.study/peers/peer0.distributor.rupiah.study/tls:/etc/hyperledger/fabric/tls:ro
      - distributor-peer-data:/var/hyperledger/production
    depends_on: [orderer.centralbank.rupiah.study, couchdb.distributor.rupiah.study]
    ports: ["18051:7051"]
    networks: [study]

  couchdb.validator.rupiah.study:
    image: couchdb:3.3
    container_name: study-couchdb-validator
    profiles: [network]
    environment: *couchdb-environment
    volumes:
      - validator-couch-data:/opt/couchdb/data
    ports: ["127.0.0.1:19584:5984"]
    networks: [study]

  peer0.validator.rupiah.study:
    image: hyperledger/fabric-peer:2.5
    container_name: study-peer0-validator
    profiles: [network]
    environment:
      <<: *peer-environment
      CORE_PEER_ID: peer0.validator.rupiah.study
      CORE_PEER_ADDRESS: peer0.validator.rupiah.study:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.validator.rupiah.study:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.validator.rupiah.study:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.validator.rupiah.study:7051
      CORE_PEER_LOCALMSPID: ValidatorMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.validator.rupiah.study:5984
      CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: ${STUDY_COUCHDB_USER}
      CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: ${STUDY_COUCHDB_PASSWORD}
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/validator.rupiah.study/peers/peer0.validator.rupiah.study/msp:/etc/hyperledger/fabric/msp:ro
      - ./organizations/peerOrganizations/validator.rupiah.study/peers/peer0.validator.rupiah.study/tls:/etc/hyperledger/fabric/tls:ro
      - validator-peer-data:/var/hyperledger/production
    depends_on: [orderer.centralbank.rupiah.study, couchdb.validator.rupiah.study]
    ports: ["19051:7051"]
    networks: [study]

  couchdb.enduser.rupiah.study:
    image: couchdb:3.3
    container_name: study-couchdb-enduser
    profiles: [network]
    environment: *couchdb-environment
    volumes:
      - enduser-couch-data:/opt/couchdb/data
    ports: ["127.0.0.1:20584:5984"]
    networks: [study]

  peer0.enduser.rupiah.study:
    image: hyperledger/fabric-peer:2.5
    container_name: study-peer0-enduser
    profiles: [network]
    environment:
      <<: *peer-environment
      CORE_PEER_ID: peer0.enduser.rupiah.study
      CORE_PEER_ADDRESS: peer0.enduser.rupiah.study:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.enduser.rupiah.study:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.enduser.rupiah.study:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.enduser.rupiah.study:7051
      CORE_PEER_LOCALMSPID: EndUserMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.enduser.rupiah.study:5984
      CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: ${STUDY_COUCHDB_USER}
      CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: ${STUDY_COUCHDB_PASSWORD}
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/enduser.rupiah.study/peers/peer0.enduser.rupiah.study/msp:/etc/hyperledger/fabric/msp:ro
      - ./organizations/peerOrganizations/enduser.rupiah.study/peers/peer0.enduser.rupiah.study/tls:/etc/hyperledger/fabric/tls:ro
      - enduser-peer-data:/var/hyperledger/production
    depends_on: [orderer.centralbank.rupiah.study, couchdb.enduser.rupiah.study]
    ports: ["20051:7051"]
    networks: [study]

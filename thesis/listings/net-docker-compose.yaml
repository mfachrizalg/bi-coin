name: bi-coin

networks:
  study:
    name: bi-coin

volumes:
  centralbank-peer-data:
    name: bi-coin-centralbank-peer
  distributor-peer-data:
    name: bi-coin-distributor-peer
  validator-peer-data:
    name: bi-coin-validator-peer
  enduser-peer-data:
    name: bi-coin-enduser-peer
  orderer-data:
    name: bi-coin-orderer
  centralbank-couch-data:
    name: bi-coin-centralbank-couch
  distributor-couch-data:
    name: bi-coin-distributor-couch
  validator-couch-data:
    name: bi-coin-validator-couch
  enduser-couch-data:
    name: bi-coin-enduser-couch
  centralbank-ca-data:
    name: bi-coin-centralbank-ca
  distributor-ca-data:
    name: bi-coin-distributor-ca
  validator-ca-data:
    name: bi-coin-validator-ca
  enduser-ca-data:
    name: bi-coin-enduser-ca
  study-postgres-data:
    name: bi-coin-postgres

x-couchdb-environment: &couchdb-environment
  COUCHDB_USER: ${COUCHDB_USER}
  COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}

x-peer-environment: &peer-environment
  FABRIC_LOGGING_SPEC: INFO
  CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
  CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: bi-coin
  CORE_PEER_TLS_ENABLED: "true"
  CORE_PEER_PROFILE_ENABLED: "true"
  CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
  CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
  CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
  CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
  CORE_PEER_CHAINCODEADDRESS: peer0:7052
  CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
  CORE_LEDGER_STATE_STATEDATABASE: CouchDB

services:
  ca.centralbank:
    image: hyperledger/fabric-ca:1.5.9
    container_name: bi-coin-ca-centralbank
    profiles: [ca]
    environment:
      FABRIC_CA_SERVER_CA_NAME: ca-centralbank
      FABRIC_CA_SERVER_TLS_ENABLED: "false"
      FABRIC_CA_SERVER_PORT: 7054
      CA_ADMIN_USER: ${CA_ADMIN_USER}
      CA_ADMIN_SECRET: ${CA_ADMIN_SECRET}
    command:
      - sh
      - -c
      - fabric-ca-server start -b "$$CA_ADMIN_USER:$$CA_ADMIN_SECRET" -d
    volumes:
      - centralbank-ca-data:/etc/hyperledger/fabric-ca-server
    ports:
      - "127.0.0.1:17054:7054"
    networks: [study]

  ca.distributor:
    image: hyperledger/fabric-ca:1.5.9
    container_name: bi-coin-ca-distributor
    profiles: [ca]
    environment:
      FABRIC_CA_SERVER_CA_NAME: ca-distributor
      FABRIC_CA_SERVER_TLS_ENABLED: "false"
      FABRIC_CA_SERVER_PORT: 7054
      CA_ADMIN_USER: ${CA_ADMIN_USER}
      CA_ADMIN_SECRET: ${CA_ADMIN_SECRET}
    command:
      - sh
      - -c
      - fabric-ca-server start -b "$$CA_ADMIN_USER:$$CA_ADMIN_SECRET" -d
    volumes:
      - distributor-ca-data:/etc/hyperledger/fabric-ca-server
    ports:
      - "127.0.0.1:18054:7054"
    networks: [study]

  ca.validator:
    image: hyperledger/fabric-ca:1.5.9
    container_name: bi-coin-ca-validator
    profiles: [ca]
    environment:
      FABRIC_CA_SERVER_CA_NAME: ca-validator
      FABRIC_CA_SERVER_TLS_ENABLED: "false"
      FABRIC_CA_SERVER_PORT: 7054
      CA_ADMIN_USER: ${CA_ADMIN_USER}
      CA_ADMIN_SECRET: ${CA_ADMIN_SECRET}
    command:
      - sh
      - -c
      - fabric-ca-server start -b "$$CA_ADMIN_USER:$$CA_ADMIN_SECRET" -d
    volumes:
      - validator-ca-data:/etc/hyperledger/fabric-ca-server
    ports:
      - "127.0.0.1:19054:7054"
    networks: [study]

  ca.enduser:
    image: hyperledger/fabric-ca:1.5.9
    container_name: bi-coin-ca-enduser
    profiles: [ca]
    environment:
      FABRIC_CA_SERVER_CA_NAME: ca-enduser
      FABRIC_CA_SERVER_TLS_ENABLED: "false"
      FABRIC_CA_SERVER_PORT: 7054
      CA_ADMIN_USER: ${CA_ADMIN_USER}
      CA_ADMIN_SECRET: ${CA_ADMIN_SECRET}
    command:
      - sh
      - -c
      - fabric-ca-server start -b "$$CA_ADMIN_USER:$$CA_ADMIN_SECRET" -d
    volumes:
      - enduser-ca-data:/etc/hyperledger/fabric-ca-server
    ports:
      - "127.0.0.1:20054:7054"
    networks: [study]

  study-cli:
    image: hyperledger/fabric-tools:2.5
    container_name: bi-coin-cli
    profiles: [tools]
    environment:
      FABRIC_CFG_PATH: /etc/hyperledger/fabric
      CORE_PEER_TLS_ENABLED: "true"
    entrypoint:
      - sh
      - -c
      - while true; do sleep 3600; done
    volumes:
      - ./organizations:/network/organizations:ro
      - ../chaincode:/chaincode:ro
      - ./packages:/network/packages
    networks: [study]

  study-postgres:
    image: postgres:16-alpine
    container_name: bi-coin-postgres
    profiles: [network]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - study-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    networks: [study]

  orderer.centralbank.bi-coin:
    image: hyperledger/fabric-orderer:2.5
    container_name: bi-coin-orderer-centralbank
    profiles: [network]
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_GENERAL_LOCALMSPID: CentralBankMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
    command: orderer
    volumes:
      - ./organizations/ordererOrganizations/centralbank.bi-coin/orderers/orderer.centralbank.bi-coin/msp:/var/hyperledger/orderer/msp:ro
      - ./organizations/ordererOrganizations/centralbank.bi-coin/orderers/orderer.centralbank.bi-coin/tls:/var/hyperledger/orderer/tls:ro
      - orderer-data:/var/hyperledger/production
    ports:
      - "17050:7050"
      - "17053:7053"
    networks: [study]

  couchdb.centralbank.bi-coin:
    image: couchdb:3.3
    container_name: bi-coin-couchdb-centralbank
    profiles: [network]
    environment: *couchdb-environment
    volumes:
      - centralbank-couch-data:/opt/couchdb/data
    ports: ["127.0.0.1:17584:5984"]
    networks: [study]

  peer0.centralbank.bi-coin:
    image: hyperledger/fabric-peer:2.5
    container_name: bi-coin-peer0-centralbank
    profiles: [network]
    environment:
      <<: *peer-environment
      CORE_PEER_ID: peer0.centralbank.bi-coin
      CORE_PEER_ADDRESS: peer0.centralbank.bi-coin:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.centralbank.bi-coin:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.centralbank.bi-coin:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.centralbank.bi-coin:7051
      CORE_PEER_LOCALMSPID: CentralBankMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.centralbank.bi-coin:5984
      CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: ${COUCHDB_USER}
      CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: ${COUCHDB_PASSWORD}
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/centralbank.bi-coin/peers/peer0.centralbank.bi-coin/msp:/etc/hyperledger/fabric/msp:ro
      - ./organizations/peerOrganizations/centralbank.bi-coin/peers/peer0.centralbank.bi-coin/tls:/etc/hyperledger/fabric/tls:ro
      - centralbank-peer-data:/var/hyperledger/production
    depends_on: [orderer.centralbank.bi-coin, couchdb.centralbank.bi-coin]
    ports: ["17051:7051"]
    networks: [study]

  couchdb.distributor.bi-coin:
    image: couchdb:3.3
    container_name: bi-coin-couchdb-distributor
    profiles: [network]
    environment: *couchdb-environment
    volumes:
      - distributor-couch-data:/opt/couchdb/data
    ports: ["127.0.0.1:18584:5984"]
    networks: [study]

  peer0.distributor.bi-coin:
    image: hyperledger/fabric-peer:2.5
    container_name: bi-coin-peer0-distributor
    profiles: [network]
    environment:
      <<: *peer-environment
      CORE_PEER_ID: peer0.distributor.bi-coin
      CORE_PEER_ADDRESS: peer0.distributor.bi-coin:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.distributor.bi-coin:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.distributor.bi-coin:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.distributor.bi-coin:7051
      CORE_PEER_LOCALMSPID: DistributorMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.distributor.bi-coin:5984
      CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: ${COUCHDB_USER}
      CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: ${COUCHDB_PASSWORD}
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/distributor.bi-coin/peers/peer0.distributor.bi-coin/msp:/etc/hyperledger/fabric/msp:ro
      - ./organizations/peerOrganizations/distributor.bi-coin/peers/peer0.distributor.bi-coin/tls:/etc/hyperledger/fabric/tls:ro
      - distributor-peer-data:/var/hyperledger/production
    depends_on: [orderer.centralbank.bi-coin, couchdb.distributor.bi-coin]
    ports: ["18051:7051"]
    networks: [study]

  couchdb.validator.bi-coin:
    image: couchdb:3.3
    container_name: bi-coin-couchdb-validator
    profiles: [network]
    environment: *couchdb-environment
    volumes:
      - validator-couch-data:/opt/couchdb/data
    ports: ["127.0.0.1:19584:5984"]
    networks: [study]

  peer0.validator.bi-coin:
    image: hyperledger/fabric-peer:2.5
    container_name: bi-coin-peer0-validator
    profiles: [network]
    environment:
      <<: *peer-environment
      CORE_PEER_ID: peer0.validator.bi-coin
      CORE_PEER_ADDRESS: peer0.validator.bi-coin:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.validator.bi-coin:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.validator.bi-coin:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.validator.bi-coin:7051
      CORE_PEER_LOCALMSPID: ValidatorMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.validator.bi-coin:5984
      CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: ${COUCHDB_USER}
      CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: ${COUCHDB_PASSWORD}
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/validator.bi-coin/peers/peer0.validator.bi-coin/msp:/etc/hyperledger/fabric/msp:ro
      - ./organizations/peerOrganizations/validator.bi-coin/peers/peer0.validator.bi-coin/tls:/etc/hyperledger/fabric/tls:ro
      - validator-peer-data:/var/hyperledger/production
    depends_on: [orderer.centralbank.bi-coin, couchdb.validator.bi-coin]
    ports: ["19051:7051"]
    networks: [study]

  couchdb.enduser.bi-coin:
    image: couchdb:3.3
    container_name: bi-coin-couchdb-enduser
    profiles: [network]
    environment: *couchdb-environment
    volumes:
      - enduser-couch-data:/opt/couchdb/data
    ports: ["127.0.0.1:20584:5984"]
    networks: [study]

  peer0.enduser.bi-coin:
    image: hyperledger/fabric-peer:2.5
    container_name: bi-coin-peer0-enduser
    profiles: [network]
    environment:
      <<: *peer-environment
      CORE_PEER_ID: peer0.enduser.bi-coin
      CORE_PEER_ADDRESS: peer0.enduser.bi-coin:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.enduser.bi-coin:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.enduser.bi-coin:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.enduser.bi-coin:7051
      CORE_PEER_LOCALMSPID: EndUserMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb.enduser.bi-coin:5984
      CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME: ${COUCHDB_USER}
      CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD: ${COUCHDB_PASSWORD}
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/enduser.bi-coin/peers/peer0.enduser.bi-coin/msp:/etc/hyperledger/fabric/msp:ro
      - ./organizations/peerOrganizations/enduser.bi-coin/peers/peer0.enduser.bi-coin/tls:/etc/hyperledger/fabric/tls:ro
      - enduser-peer-data:/var/hyperledger/production
    depends_on: [orderer.centralbank.bi-coin, couchdb.enduser.bi-coin]
    ports: ["20051:7051"]
    networks: [study]

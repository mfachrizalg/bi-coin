# Study Caliper network config. benchmark/compliance/caliper-config.js writes this
# structure as caliper-network.json at run time (writeFabricNetworkConfig).
name: Retail Rupiah Compliance Study
version: "2.0.0"
caliper:
  blockchain: fabric

channels:
  - channelName: rupiah-study
    contracts:
      - id: rupiah-monetary
      - id: rupiah-controls
      - id: rupiah-payments

organizations:
  - mspid: CentralBankMSP
    identities:
      certificates:
        # UNRESOLVED: CentralBankMSP signer names and key/certificate paths
        - name: <username>
          clientPrivateKey:
            path: <absolute path to signer key>
          clientSignedCert:
            path: <absolute path to signer certificate>
    connectionProfile:
      path: <result-dir>/caliper-network/connection-profiles/CentralBankMSP.json

  - mspid: DistributorMSP
    identities:
      certificates:
        # example: one of three DistributorMSP signers (User1), values from network/study/README.md
        - name: pjp-reviewer
          clientPrivateKey:
            path: /absolute/path/to/User1@distributor.rupiah.study/msp/keystore/priv_sk
          clientSignedCert:
            path: /absolute/path/to/User1@distributor.rupiah.study/msp/signcerts/User1@distributor.rupiah.study-cert.pem
    connectionProfile:
      path: <result-dir>/caliper-network/connection-profiles/DistributorMSP.json

  - mspid: ValidatorMSP
    identities:
      certificates:
        # UNRESOLVED: ValidatorMSP signer names and key/certificate paths
        - name: <username>
          clientPrivateKey:
            path: <absolute path to signer key>
          clientSignedCert:
            path: <absolute path to signer certificate>
    connectionProfile:
      path: <result-dir>/caliper-network/connection-profiles/ValidatorMSP.json

  - mspid: EndUserMSP
    identities:
      certificates:
        # UNRESOLVED: EndUserMSP signer names (eight identities exist) and key/certificate paths
        - name: <username>
          clientPrivateKey:
            path: <absolute path to signer key>
          clientSignedCert:
            path: <absolute path to signer certificate>
    connectionProfile:
      path: <result-dir>/caliper-network/connection-profiles/EndUserMSP.json

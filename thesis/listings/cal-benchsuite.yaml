# benchmark/benchconfigs/retail-transfer-repeat.yaml
test:
  name: Digital Rupiah Retail Transfer - Repetition (mean +/- CI)
  description: Five identical peak rounds of the contention-free transfer workload so throughput/latency can be reported with a confidence interval
  workers:
    type: local
    number: 2
  rounds:
    - label: retail-peak-rep-1
      txNumber: 40
      rateControl:
        type: fixed-rate
        opts:
          tps: 60
      workload: &repeat_workload
        module: benchmark/workloads/retail-transfer.js
        arguments:
          scenario: transfer-repeat
          customers: 80
          merchants: 10
          transactionSlots: 20
          fundedRatio: 1
    - label: retail-peak-rep-2
      txNumber: 40
      rateControl:
        type: fixed-rate
        opts:
          tps: 60
      workload: *repeat_workload
    - label: retail-peak-rep-3
      txNumber: 40
      rateControl:
        type: fixed-rate
        opts:
          tps: 60
      workload: *repeat_workload
    - label: retail-peak-rep-4
      txNumber: 40
      rateControl:
        type: fixed-rate
        opts:
          tps: 60
      workload: *repeat_workload
    - label: retail-peak-rep-5
      txNumber: 40
      rateControl:
        type: fixed-rate
        opts:
          tps: 60
      workload: *repeat_workload


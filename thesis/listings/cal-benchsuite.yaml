# benchmark/benchconfigs/negative-path.yaml
test:
  name: Digital Rupiah Negative-Path Conformance
  description: Every submission violates one policy rule and must be rejected; a zero-gap run proves enforcement
  workers:
    type: local
    number: 2
  rounds:
    - label: negative-path
      txNumber: 42
      rateControl:
        type: fixed-rate
        opts:
          tps: 5
      workload:
        module: benchmark/workloads/negative-path.js
        arguments:
          scenario: negative-path

---
# benchmark/benchconfigs/adversarial.yaml
test:
  name: Digital Rupiah Adversarial Double-Spend
  description: Concurrent transfers from one shared sender to force MVCC version conflicts; rejections evidence double-spend prevention
  workers:
    type: local
    number: 4
  rounds:
    - label: double-spend-contention
      txNumber: 200
      rateControl:
        type: fixed-rate
        opts:
          tps: 80
      workload:
        module: benchmark/workloads/adversarial-double-spend.js
        arguments:
          scenario: double-spend
          receivers: 20
          transferAmount: 1000
          senderFunding: 19000000

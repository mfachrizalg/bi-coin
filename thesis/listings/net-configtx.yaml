Organizations:
  - &CentralBank
    Name: CentralBankMSP
    ID: CentralBankMSP
    MSPDir: organizations/peerOrganizations/centralbank.bi-coin/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('CentralBankMSP.admin', 'CentralBankMSP.peer', 'CentralBankMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('CentralBankMSP.admin', 'CentralBankMSP.client', 'CentralBankMSP.orderer')"
      Admins:
        Type: Signature
        Rule: "OR('CentralBankMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('CentralBankMSP.peer')"
    OrdererEndpoints:
      - "orderer.centralbank.bi-coin:7050"
    AnchorPeers:
      - Host: peer0.centralbank.bi-coin
        Port: 7051

  - &Distributor
    Name: DistributorMSP
    ID: DistributorMSP
    MSPDir: organizations/peerOrganizations/distributor.bi-coin/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('DistributorMSP.admin', 'DistributorMSP.peer', 'DistributorMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('DistributorMSP.admin', 'DistributorMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('DistributorMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('DistributorMSP.peer')"
    AnchorPeers:
      - Host: peer0.distributor.bi-coin
        Port: 7051

  - &Validator
    Name: ValidatorMSP
    ID: ValidatorMSP
    MSPDir: organizations/peerOrganizations/validator.bi-coin/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('ValidatorMSP.admin', 'ValidatorMSP.peer', 'ValidatorMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('ValidatorMSP.admin', 'ValidatorMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('ValidatorMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('ValidatorMSP.peer')"
    AnchorPeers:
      - Host: peer0.validator.bi-coin
        Port: 7051

  - &EndUser
    Name: EndUserMSP
    ID: EndUserMSP
    MSPDir: organizations/peerOrganizations/enduser.bi-coin/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('EndUserMSP.admin', 'EndUserMSP.peer', 'EndUserMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('EndUserMSP.admin', 'EndUserMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('EndUserMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('EndUserMSP.peer')"
    AnchorPeers:
      - Host: peer0.enduser.bi-coin
        Port: 7051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_0: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer.centralbank.bi-coin:7050
  EtcdRaft:
    Consenters:
      - Host: orderer.centralbank.bi-coin
        Port: 7050
        ClientTLSCert: organizations/ordererOrganizations/centralbank.bi-coin/orderers/orderer.centralbank.bi-coin/tls/server.crt
        ServerTLSCert: organizations/ordererOrganizations/centralbank.bi-coin/orderers/orderer.centralbank.bi-coin/tls/server.crt
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 10 MB
    PreferredMaxBytes: 2 MB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities: *ChannelCapabilities

Profiles:
  BiCoinChannel:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *CentralBank
      Capabilities: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *CentralBank
        - *Distributor
        - *Validator
        - *EndUser
      Capabilities: *ApplicationCapabilities
